<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Personal website of rnk7v">
  <title>rnk7v</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --surface: #12151c;
      --border: #252a35;
      --text: #f2f4fa;
      --muted: #858d9e;
      --accent: #91adff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(#ffffff06 1px, transparent 1px),
        linear-gradient(90deg, #ffffff06 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(
        to bottom, black, transparent 85%
      );
      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
      border-radius: 4px;
    }

    .container {
      width: min(100% - 48px, 960px);
      margin-inline: auto;
    }

    header {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.8px;
    }

    .accent {
      color: var(--accent);
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: var(--muted);
      font-size: 13px;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--text);
    }

    .hero {
      min-height: 490px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      position: relative;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: min(500px, 90vw);
      aspect-ratio: 1;
      background: radial-gradient(
        circle,
        #6385fc20 0%,
        #6385fc08 40%,
        transparent 70%
      );
      filter: blur(30px);
      z-index: -1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #151922;
      color: #a7afc0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px #91adff80;
    }

    h1 {
      margin: 25px 0 8px;
      font-size: clamp(76px, 14vw, 144px);
      font-weight: 750;
      letter-spacing: -0.085em;
      line-height: 1.1;
    }

    .hero-line {
      width: 42px;
      height: 2px;
      margin-top: 23px;
      background: linear-gradient(
        90deg, transparent, var(--accent), transparent
      );
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #b7bfce;
    }

    .section-title span {
      font-size: 12px;
      color: var(--muted);
    }

    .project-card {
      display: block;
      padding: 28px;
      background: linear-gradient(
        135deg, #171b25, var(--surface)
      );
      border: 1px solid var(--border);
      border-radius: 14px;
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: #52679a;
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .project-card h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .project-card p {
      margin: 12px 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .arrow {
      font-size: 20px;
      color: var(--muted);
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #222838;
      color: #a5b9ee;
      font-size: 11px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 90px;
      padding: 28px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    footer a:hover {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 36px, 960px);
      }

      header {
        height: 70px;
      }

      nav {
        gap: 18px;
      }

      .hero {
        min-height: 430px;
      }

      .project-card {
        padding: 22px;
      }

      footer {
        margin-top: 65px;
        gap: 15px;
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <a href="/" class="logo" aria-label="rnk7v home">
        rnk7v<span class="accent">.</span>
      </a>

      <nav aria-label="Main navigation">
        <a href="#projects">Projects</a>
        <a href="https://github.com/rnk7v"
           target="_blank"
           rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-label="Introduction">
        <div class="status">
          <span class="status-dot"></span>
          Personal website
        </div>

        <h1>rnk7v<span class="accent">.</span></h1>

        <div class="hero-line"></div>
      </section>

      <section id="projects" aria-labelledby="projects-title">
        <div class="section-title">
          <h2 id="projects-title">Selected projects</h2>
          <span>01 / Projects</span>
        </div>

        <a class="project-card"
           href="https://github.com/rnk7v/rnk7v-site"
           target="_blank"
           rel="noopener noreferrer">
          <div class="project-top">
            <h3>rnk7v-site</h3>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>

          <p>
            Source code for this website.
            Built with HTML and CSS,
            hosted on Cloudflare Pages.
          </p>

          <span class="tag">HTML / CSS</span>
        </a>
      </section>
    </main>

    <footer>
      <span>rnk7v<span class="accent">.</span></span>
      <span>Hosted on Cloudflare Pages</span>
      <a href="https://github.com/rnk7v"
         target="_blank"
         rel="noopener noreferrer">GitHub ↗</a>
    </footer>

  </div>
</body>
</html>
